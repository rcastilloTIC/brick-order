{% extends "base.html" %}{% block content %}<h1>Límites de la campaña</h1><p>Los cambios se registran en auditoría. Evita modificarlos con pedidos ya comprometidos.</p><form method="post" class="card p-4" style="max-width:640px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Importe mínimo (€)</label><input class="form-control mb-3" type="number" min="0.01" step="0.01" name="minimum_total" value="{{ minimum_total }}" required><label class="form-label">Importe máximo por persona (€)</label><input class="form-control mb-3" type="number" min="0.01" step="0.01" name="phase_one_order_limit" value="{{ max_per_person }}" required><label class="form-label">Máximo de referencias seleccionadas</label><input class="form-control mb-3" type="number" min="1" max="1000" step="1" name="final_selection_limit" value="{{ max_references }}" required><button class="btn btn-primary">Guardar límites</button></form>{% endblock %}
