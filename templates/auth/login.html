{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="bom-auth-layout"><div class="row justify-content-center w-100">
  <div class="col-md-8 col-lg-6 bom-auth-card">
    <h2 class="mb-4 text-center">Acceso a VALBRICK</h2>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label for="username" class="form-label">Usuario</label>
        <input type="text" class="form-control" id="username" name="username" required autofocus>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" value="on" id="remember" name="remember">
        <label class="form-check-label" for="remember">Recordarme en este equipo</label>
      </div>
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary">Entrar</button>
      </div>
    </form>
  </div>
</div>
</div>
{% endblock %}
